spring:
  application:
    name: librarium
  datasource:
    url: jdbc:h2:file:./data/librarium;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  sql:
    init:
      mode: never

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

librarium:
  firebase:
    project-id: librarium-dd543
  admin-emails:
    - godsnooch@gmail.com
