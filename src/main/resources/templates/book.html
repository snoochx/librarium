<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${book.title} + ' · Librarium'">Book</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body">
<div th:replace="~{fragments :: topbar(${currentUser})}"></div>

<main class="page-shell page-shell--book book-page">
    <header class="catalog-header book-page__header">
        <div class="catalog-header__copy">
            <h1 class="catalog-title">Информация о книге</h1>
        </div>
    </header>

    <section class="book-page__grid">
        <article class="panel book-page__card book-page__card--visual">
            <div class="book-display-plate">
                <img th:src="${book.backgroundPath}" class="book-display-plate__bg" alt="background"/>
                <div class="book-display-plate__overlay"></div>

                <div class="book-display-plate__badge book-display-plate__badge--diamond"
                     th:if="${book.badgeLabel == 'Алмазная'}"
                     th:text="${book.badgeLabel}">Алмазная</div>
                <div class="book-display-plate__badge book-display-plate__badge--gold"
                     th:if="${book.badgeLabel == 'Золотая'}"
                     th:text="${book.badgeLabel}">Золотая</div>

                <div class="book-display-plate__content">
                    <div class="book-display-plate__title clamp-2" th:text="${book.title}">Title</div>
                    <div class="book-display-plate__author clamp-1" th:text="${book.author}">Author</div>
                </div>

                <img th:src="${book.badgeIconPath}" class="book-display-plate__icon" th:alt="${book.badgeLabel}"/>
            </div>
        </article>

        <article class="panel book-page__card book-page__card--info">
            <div class="book-page__details">
                <div class="book-page__section-head">
                    <h2 class="section-title">Информация</h2>
                </div>

                <div class="book-page__meta-list">
                    <div class="book-page__meta-row">
                        <span class="book-page__meta-label">Автор</span>
                        <span class="book-page__meta-value" th:text="${book.author}">Author</span>
                    </div>
                    <div class="book-page__meta-row">
                        <span class="book-page__meta-label">Название</span>
                        <span class="book-page__meta-value" th:text="${book.title}">Title</span>
                    </div>
                    <div class="book-page__meta-row">
                        <span class="book-page__meta-label">Год</span>
                        <span class="book-page__meta-value" th:text="${book.publicationYear != null ? book.publicationYear : '—'}">2024</span>
                    </div>
                    <div class="book-page__meta-row">
                        <span class="book-page__meta-label">Рейтинг</span>
                        <span class="rating-inline rating-inline--sm"
                              th:with="rating=${book.averageRating}">
                            <span class="rating-inline__value" th:text="${@uiFormat.averageRatingLabel(rating)}">5.0</span>
                            <span class="rating-stars" aria-hidden="true">
                                <th:block th:each="starIndex : ${#numbers.sequence(1,5)}">
                                    <span class="rating-stars__star"
                                          th:style="|--star-fill:${@uiFormat.starFillPercent(rating, starIndex)}%|">
                                        <span class="rating-stars__base">★</span>
                                        <span class="rating-stars__fill">★</span>
                                    </span>
                                </th:block>
                            </span>
                        </span>
                    </div>
                    <div class="book-page__meta-row">
                        <span class="book-page__meta-label">Отзывы</span>
                        <span class="book-page__meta-value" th:text="${@uiFormat.reviewCount(book.reviewCount)}">0 отзывов</span>
                    </div>
                </div>
            </div>

            <div class="book-page__collections">
                <div class="book-page__section-head">
                    <h2 class="section-title">Добавление в коллекции</h2>
                </div>

                <div th:if="${currentUser != null}" class="book-page__collections-actions">
                    <form th:action="@{/books/{bookId}/status(bookId=${book.id})}" method="post" class="book-page__collection-form">
                        <input type="hidden" name="status" value="NOT_READ"/>
                        <button class="btn book-page__collection-btn"
                                th:classappend="${userEntry == null or userEntry.status.name() == 'NOT_READ'} ? ' btn-primary active-btn' : ' btn-outline-light'">
                            Не читал
                        </button>
                    </form>

                    <form th:action="@{/books/{bookId}/status(bookId=${book.id})}" method="post" class="book-page__collection-form">
                        <input type="hidden" name="status" value="READ"/>
                        <button class="btn book-page__collection-btn"
                                th:classappend="${userEntry != null and userEntry.status.name() == 'READ'} ? ' btn-primary active-btn' : ' btn-outline-light'">
                            Прочитано
                        </button>
                    </form>

                    <form th:action="@{/books/{bookId}/status(bookId=${book.id})}" method="post" class="book-page__collection-form">
                        <input type="hidden" name="status" value="PLANNED"/>
                        <button class="btn book-page__collection-btn"
                                th:classappend="${userEntry != null and userEntry.status.name() == 'PLANNED'} ? ' btn-primary active-btn' : ' btn-outline-light'">
                            В планах
                        </button>
                    </form>
                </div>

                <div th:if="${currentUser == null}" class="text-soft">
                    Войдите, чтобы добавлять книгу в коллекции.
                </div>
            </div>
        </article>
    </section>

    <section class="panel book-page__reviews">
        <h2 class="section-title">Отзывы</h2>

        <div th:if="${currentUser != null}" class="book-page__my-review">
            <div class="book-page__subsection-head">
                <h3 class="book-page__subsection-title">Мой отзыв</h3>
                <form th:if="${myReview != null}" th:action="@{/books/{id}/review/delete(id=${book.id})}" method="post" class="book-page__review-delete-form">
                    <button class="btn btn-sm btn-outline-light" type="submit">Удалить</button>
                </form>
            </div>

            <form th:action="@{/books/{id}/review(id=${book.id})}"
                  method="post"
                  th:object="${reviewForm}"
                  class="review-form"
                  data-review-form>
                <div class="review-form__rating" role="radiogroup" aria-label="Оценка">
                    <th:block th:each="star : ${#numbers.sequence(5,1)}">
                        <input class="review-form__rating-input"
                               type="radio"
                               th:field="*{rating}"
                               th:value="${star}"
                               th:id="${'review-rating-' + star}"/>
                        <label class="review-form__rating-label"
                               th:for="${'review-rating-' + star}"
                               th:text="'★'">★</label>
                    </th:block>
                </div>

                <div class="review-form__footer">
                    <div class="review-form__error text-danger small" th:if="${#fields.hasAnyErrors()}">
                        <span th:errors="*{rating}"></span>
                    </div>
                    <button class="btn btn-primary review-form__submit" type="submit" data-review-submit th:disabled="${reviewForm.rating == null}">Опубликовать</button>
                </div>
            </form>
        </div>

        <div class="book-page__all-reviews">
            <h3 class="book-page__subsection-title">Все отзывы</h3>

            <div th:if="${#lists.isEmpty(reviews)}" class="empty-state empty-state--tight book-page__empty-state">
                <img src="/assets/icons/noreviews.png" class="empty-state__image empty-state__image--compact empty-state__image--float" alt="" aria-hidden="true"/>
                <div class="empty-state__caption">Отзывов пока нет</div>
            </div>

            <div th:unless="${#lists.isEmpty(reviews)}" class="book-page__review-grid">
                <article th:each="review : ${reviews}" class="book-page__review-card">
                    <div class="book-page__review-head">
                        <div class="book-page__review-author" th:text="${review.reviewerName}">User</div>
                        <div class="rating-inline rating-inline--sm rating-inline--review"
                             th:with="rating=${review.rating}">
                            <span class="rating-inline__value" th:text="${@uiFormat.reviewRatingLabel(rating)}">5</span>
                            <span class="rating-stars" aria-hidden="true">
                                <th:block th:each="starIndex : ${#numbers.sequence(1,5)}">
                                    <span class="rating-stars__star"
                                          th:style="|--star-fill:${@uiFormat.starFillPercent(rating, starIndex)}%|">
                                        <span class="rating-stars__base">★</span>
                                        <span class="rating-stars__fill">★</span>
                                    </span>
                                </th:block>
                            </span>
                        </div>
                    </div>

                    <div class="book-page__review-date" th:text="${@uiFormat.reviewDate(review.updatedAt)}">22 мая, 11:48</div>
                </article>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/cursor.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
