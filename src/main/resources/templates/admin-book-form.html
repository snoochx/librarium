<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${formMode == 'edit' ? 'Редактирование книги' : 'Новая книга'} + ' · Панель · Librarium'">Книга</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body">
<div th:replace="~{fragments :: topbar(${currentUser})}"></div>

<main class="page-shell page-shell--admin admin-page">
    <div class="admin-shell">
        <div th:replace="~{fragments :: adminSidebar(${adminSection})}"></div>

        <section class="admin-content">
            <header class="catalog-header admin-content__header">
                <div class="catalog-header__copy">
                    <h1 class="catalog-title" th:text="${formMode == 'edit' ? 'Редактировать книгу' : 'Добавить книгу'}">Добавить книгу</h1>

                </div>
            </header>

            <section class="panel admin-section-panel admin-form-panel">
                <div class="app-toast-marker" th:if="${success}" data-toast-message th:text="${success}">Saved</div>

                <form th:action="${formMode == 'edit' ? '/panel/books/' + editingBook.id : '/panel/books'}"
                      method="post"
                      th:object="${bookForm}"
                      class="form-grid admin-book-form"
                      data-admin-book-form>
                    <input type="hidden" th:field="*{suggestionId}"/>

                    <div class="form-grid__cell">
                        <label class="field-label" for="book-title">Название</label>
                        <input id="book-title"
                               class="form-control"
                               th:field="*{title}"
                               placeholder="Название книги"
                               autocomplete="off"
                               autocapitalize="off"
                               spellcheck="false"
                               required/>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <div class="form-grid__cell">
                        <label class="field-label" for="book-author">Автор</label>
                        <input id="book-author"
                               class="form-control"
                               th:field="*{author}"
                               placeholder="Автор"
                               autocomplete="off"
                               autocapitalize="off"
                               spellcheck="false"
                               required/>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
                    </div>


                    <div class="form-grid__cell admin-book-form__publish-row">
                        <div class="admin-book-form__year-wrap">
                            <label class="field-label" for="book-year">Год</label>
                            <input id="book-year"
                                   class="form-control"
                                   th:field="*{publicationYear}"
                                   type="text"
                                   inputmode="numeric"
                                   pattern="[0-9]*"
                                   placeholder="2024"
                                   required/>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('publicationYear')}" th:errors="*{publicationYear}"></div>
                        </div>

                        <button class="btn btn-primary admin-book-form__submit"
                                type="submit"
                                th:text="${formMode == 'edit' ? 'Сохранить' : 'Опубликовать'}"
                                disabled>
                            Опубликовать
                        </button>
                    </div>
                </form>

                <script>
                    (function () {
                        const form = document.querySelector('[data-admin-book-form]');
                        if (!form) return;

                        const title = form.querySelector('#book-title');
                        const author = form.querySelector('#book-author');
                        const year = form.querySelector('#book-year');
                        const submit = form.querySelector('.admin-book-form__submit');

                        if (!title || !author || !year || !submit) return;

                        const sync = () => {
                            const filled = Boolean(title.value.trim() && author.value.trim() && year.value.trim());
                            submit.disabled = !filled;
                        };

                        ['input', 'change', 'keyup'].forEach((eventName) => {
                            title.addEventListener(eventName, sync);
                            author.addEventListener(eventName, sync);
                            year.addEventListener(eventName, sync);
                        });

                        sync();
                    })();
                </script>
            </section>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/cursor.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
