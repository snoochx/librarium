<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Librarium</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body">
<div th:replace="~{fragments :: topbar(${currentUser})}"></div>

<main class="page-shell page-shell--home">
    <section class="landing-hero">
        <div class="landing-copy">
            <span class="landing-kicker">Librarium by snoochx</span>
            <h1 class="landing-title">Каталог книг с личным профилем</h1>
            <p class="landing-description">
                Каталог насчитывает более <span th:text="${catalogCountLabel}">100</span> книг и постоянно пополняется. Читайте с удовольствием!
            </p>
            <div class="landing-actions">
                <a class="btn btn-primary" href="/catalog">Открыть каталог</a>
                <a th:if="${currentUser == null}" class="btn btn-outline-light" href="/login">Войти через Google</a>
            </div>
        </div>

        <div class="landing-visual">
            <img src="/assets/icons/icon_site.png" alt="Librarium" class="landing-graphic"/>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/cursor.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
