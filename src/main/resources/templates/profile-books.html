<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мои книги · Librarium</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body">
<div th:replace="~{fragments :: topbar(${currentUser})}"></div>

<main class="page-shell page-shell--catalog profile-books-page">
    <header class="catalog-header profile-books-page__header">
        <div class="catalog-header__copy">
            <h1 class="catalog-title">Мои книги</h1>
        </div>
        <a class="btn btn-soft" href="/profile">Назад в профиль</a>
    </header>

    <section class="panel profile-books-tabs" data-profile-books-tabs>
        <div class="profile-books-tabs__bar" role="tablist" aria-label="Коллекции книг">
            <button class="profile-books-tabs__button is-active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    data-profile-books-tab="read">
                Прочитанное
            </button>
            <button class="profile-books-tabs__button"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    data-profile-books-tab="planned">
                В планах
            </button>
        </div>

        <div class="profile-books-tabs__panes">
            <section class="profile-books-pane is-active"
                     role="tabpanel"
                     data-profile-books-pane="read">
                <div class="profile-books-list" th:if="${readEntries != null and !#lists.isEmpty(readEntries)}">
                    <a class="profile-books-row" th:each="entry : ${readEntries}" th:href="@{/books/{id}(id=${entry.book.id})}">
                        <div class="profile-books-row__book">
                            <div class="profile-books-row__title" th:text="${entry.book.title}">Title</div>
                            <div class="profile-books-row__author" th:text="${entry.book.author}">Author</div>
                        </div>

                        <span class="profile-books-row__divider" aria-hidden="true"></span>

                        <div class="profile-books-row__meta">
                            <span class="rating-inline rating-inline--sm"
                                  th:with="rating=${entry.book.averageRating}">
                                <span class="rating-inline__value" th:text="${@uiFormat.averageRatingLabel(rating)}">5.0</span>
                                <span class="rating-stars" aria-hidden="true">
                                    <th:block th:each="starIndex : ${#numbers.sequence(1,5)}">
                                        <span class="rating-stars__star"
                                              th:style="|--star-fill:${@uiFormat.starFillPercent(rating, starIndex)}%|">
                                            <span class="rating-stars__base">★</span>
                                            <span class="rating-stars__fill">★</span>
                                        </span>
                                    </th:block>
                                </span>
                            </span>
                            <div class="profile-books-row__reviews"
                                 th:text="${@uiFormat.reviewCount(entry.book.reviewCount)}">0 отзывов</div>
                        </div>
                    </a>
                </div>

                <div th:unless="${readEntries != null and !#lists.isEmpty(readEntries)}" class="empty-state empty-state--tight profile-books-empty-state">
                    <img src="/assets/icons/nobooksread.png" class="empty-state__image empty-state__image--compact empty-state__image--float" alt="" aria-hidden="true"/>
                    <div class="empty-state__caption">Нет прочитанных книг</div>
                </div>
            </section>

            <section class="profile-books-pane"
                     role="tabpanel"
                     data-profile-books-pane="planned"
                     hidden>
                <div class="profile-books-list" th:if="${plannedEntries != null and !#lists.isEmpty(plannedEntries)}">
                    <a class="profile-books-row" th:each="entry : ${plannedEntries}" th:href="@{/books/{id}(id=${entry.book.id})}">
                        <div class="profile-books-row__book">
                            <div class="profile-books-row__title" th:text="${entry.book.title}">Title</div>
                            <div class="profile-books-row__author" th:text="${entry.book.author}">Author</div>
                        </div>

                        <span class="profile-books-row__divider" aria-hidden="true"></span>

                        <div class="profile-books-row__meta">
                            <span class="rating-inline rating-inline--sm"
                                  th:with="rating=${entry.book.averageRating}">
                                <span class="rating-inline__value" th:text="${@uiFormat.averageRatingLabel(rating)}">5.0</span>
                                <span class="rating-stars" aria-hidden="true">
                                    <th:block th:each="starIndex : ${#numbers.sequence(1,5)}">
                                        <span class="rating-stars__star"
                                              th:style="|--star-fill:${@uiFormat.starFillPercent(rating, starIndex)}%|">
                                            <span class="rating-stars__base">★</span>
                                            <span class="rating-stars__fill">★</span>
                                        </span>
                                    </th:block>
                                </span>
                            </span>
                            <div class="profile-books-row__reviews"
                                 th:text="${@uiFormat.reviewCount(entry.book.reviewCount)}">0 отзывов</div>
                        </div>
                    </a>
                </div>

                <div th:unless="${plannedEntries != null and !#lists.isEmpty(plannedEntries)}" class="empty-state empty-state--tight profile-books-empty-state">
                    <img src="/assets/icons/nobooksinplans.png" class="empty-state__image empty-state__image--compact empty-state__image--float" alt="" aria-hidden="true"/>
                    <div class="empty-state__caption">Нет книг в планах</div>
                </div>
            </section>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/assets/js/cursor.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
