<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ошибка · Librarium</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body">
<main class="page-shell page-shell--error">
    <section class="panel error-panel">
        <div class="pill-badge pill-badge--spaced">Ошибка</div>
        <h1 class="error-code" th:text="${status != null ? status : 500}">500</h1>
        <p class="error-message" th:text="${message != null ? message : 'Что-то пошло не так'}">Something went wrong</p>
        <a class="btn btn-primary" href="/">На главную</a>
    </section>
</main>
</body>
</html>
