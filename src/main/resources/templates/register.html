<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация · Librarium</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo_mini.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/assets/css/app.css"/>
</head>
<body class="page-body page-body--auth">
<div th:replace="~{fragments :: topbar(${currentUser})}"></div>

<main class="page-shell page-shell--auth">
    <section class="auth-panel auth-panel--center">
        <h1 class="auth-panel__title">Регистрация</h1>
        <p class="auth-panel__text">
            Создайте профиль через Google за один шаг. После подтверждения аккаунта Librarium сразу откроет личный кабинет и коллекцию.
        </p>

        <div class="auth-panel__actions">
            <button class="auth-google-button" type="button" data-google-auth data-auth-mode="register">
                <span class="auth-google-button__label">Зарегистрироваться через Google</span>
            </button>
            <a class="auth-switch-link" href="/login">Есть аккаунт? Войдите</a>
        </div>

    </section>
</main>

<script type="module" src="/assets/js/cursor.js"></script>
<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
